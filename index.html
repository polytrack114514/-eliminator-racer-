<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>赛车淘汰之王 · The Eliminator 2D</title>
<style>
  /* 全局重置与基础样式 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0a0a; color: #fff;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  /* Canvas 自适应窗口，保持 16:9 比例 */
  #game {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: #1a1a1a;
    display: block;
    box-shadow: 0 0 40px rgba(0,0,0,0.8);
    image-rendering: pixelated;
  }

  /* ===== HUD 左上角：血量/等级/速度 ===== */
  #hud-left {
    position: absolute; top: 12px; left: 12px;
    background: rgba(0,0,0,0.55);
    padding: 10px 14px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.15);
    min-width: 220px; pointer-events: none;
  }
  .hp-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .hp-label { font-size: 13px; color: #ff6b6b; font-weight: bold; width: 28px; }
  .hp-bar-bg {
    flex: 1; height: 16px; background: #2a0a0a;
    border: 1px solid #4a1a1a; border-radius: 3px; overflow: hidden;
  }
  #hp-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff3030, #ff6b6b);
    transition: width 0.15s linear;
  }
  .stat-row {
    display: flex; justify-content: space-between;
    font-size: 13px; color: #ddd; margin-top: 3px;
  }
  .stat-row .val { color: #ffd33d; font-weight: bold; }
  #car-level-name { color: #6cf; }

  /* ===== HUD 顶部中央：存活人数 ===== */
  #hud-top {
    position: absolute; top: 12px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.55);
    padding: 8px 18px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.15);
    text-align: center; pointer-events: none;
  }
  #alive-count { font-size: 26px; font-weight: bold; color: #fff; }
  #alive-label { font-size: 11px; color: #999; letter-spacing: 1px; }

  /* ===== HUD 右上角：小地图 ===== */
  #minimap-wrap {
    position: absolute; top: 12px; right: 12px;
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 6px; padding: 4px;
    pointer-events: none;
  }
  #minimap { display: block; background: #111; }

  /* ===== HUD 底部：操作提示 ===== */
  #hud-bottom {
    position: absolute; bottom: 10px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.5);
    padding: 6px 16px; border-radius: 6px;
    font-size: 12px; color: #bbb;
    pointer-events: none; letter-spacing: 0.5px;
  }
  #hud-bottom kbd {
    background: #333; color: #fff; padding: 1px 5px;
    border-radius: 3px; border: 1px solid #555;
    font-family: monospace;
  }

  /* ===== 倒计时 3-2-1-GO ===== */
  #countdown {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 120px; font-weight: bold;
    color: #ffd33d; text-shadow: 0 0 30px rgba(255,210,60,0.9), 0 4px 8px #000;
    pointer-events: none; display: none;
    animation: cdpop 0.7s ease-out;
  }
  @keyframes cdpop {
    0% { transform: translate(-50%,-50%) scale(2); opacity: 0; }
    30% { opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
  }

  /* ===== 1v1 状态提示 ===== */
  #h2h-banner {
    position: absolute; top: 80px; left: 50%;
    transform: translateX(-50%);
    background: rgba(255,40,40,0.85);
    padding: 6px 20px; border-radius: 4px;
    font-size: 16px; font-weight: bold; color: #fff;
    display: none; pointer-events: none;
    border: 1px solid #ff8080;
    text-shadow: 0 1px 2px #000;
  }

  /* ===== 1v1 胜利选择面板 ===== */
  #choice-panel {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.85);
    border: 2px solid #ffd33d; border-radius: 12px;
    padding: 24px 30px; display: none;
    text-align: center; box-shadow: 0 0 40px rgba(255,210,60,0.4);
  }
  #choice-panel h2 { color: #ffd33d; margin-bottom: 6px; font-size: 22px; }
  #choice-panel p { color: #ccc; font-size: 13px; margin-bottom: 18px; }
  .choice-btn {
    display: block; width: 280px; margin: 8px auto;
    padding: 12px; font-size: 15px; font-weight: bold;
    border: 2px solid #6cf; background: rgba(40,80,120,0.6);
    color: #fff; border-radius: 8px; cursor: pointer;
    transition: all 0.15s;
  }
  .choice-btn:hover { background: rgba(60,120,180,0.8); transform: translateY(-1px); }
  .choice-btn.b { border-color: #6f6; background: rgba(40,100,60,0.6); }
  .choice-btn.b:hover { background: rgba(60,140,80,0.8); }

  /* ===== 游戏结束/胜利 ===== */
  #end-screen {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.9);
    border: 2px solid #ff3030; border-radius: 12px;
    padding: 30px 50px; display: none;
    text-align: center;
    box-shadow: 0 0 50px rgba(255,40,40,0.5);
  }
  #end-screen.win { border-color: #ffd33d; box-shadow: 0 0 50px rgba(255,210,60,0.6); }
  #end-screen h1 { font-size: 36px; margin-bottom: 10px; }
  #end-screen.lose h1 { color: #ff3030; }
  #end-screen.win h1 { color: #ffd33d; text-shadow: 0 0 20px rgba(255,210,60,0.8); }
  #end-screen p { color: #ccc; margin-bottom: 18px; font-size: 14px; }
  #restart-btn {
    padding: 12px 32px; font-size: 16px; font-weight: bold;
    background: #ffd33d; color: #000; border: none;
    border-radius: 6px; cursor: pointer;
  }
  #restart-btn:hover { background: #ffe066; }

  /* ===== 决赛圈提示 ===== */
  #final-banner {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 48px; font-weight: bold; color: #ffd33d;
    text-shadow: 0 0 30px rgba(255,210,60,0.9), 0 4px 8px #000;
    display: none; pointer-events: none; text-align: center;
    animation: cdpop 0.7s ease-out;
  }

  /* ===== 隐身状态指示 ===== */
  #stealth-indicator {
    position: absolute; bottom: 50px; left: 50%;
    transform: translateX(-50%);
    background: rgba(100,100,255,0.7);
    padding: 4px 14px; border-radius: 4px;
    font-size: 12px; color: #fff; display: none;
    pointer-events: none;
  }

  /* ===== 手机触屏控制（仅触屏设备显示） ===== */
  #touch-controls {
    position: absolute; bottom: 0; left: 0;
    width: 100%; height: 100%; pointer-events: none;
    display: none;
  }
  /* 摇杆底座 */
  #joystick-base {
    position: absolute; bottom: 30px; left: 30px;
    width: 130px; height: 130px; border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.3);
    pointer-events: auto;
    touch-action: none;
  }
  /* 摇杆手柄 */
  #joystick-stick {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 60px; height: 60px; border-radius: 50%;
    background: rgba(80,180,255,0.7);
    border: 2px solid rgba(255,255,255,0.6);
    pointer-events: none;
  }
  /* 右下按钮组 */
  .touch-btn {
    position: absolute; border-radius: 50%;
    pointer-events: auto; touch-action: none;
    color: #fff; font-weight: bold; font-size: 13px;
    border: 2px solid rgba(255,255,255,0.5);
    display: flex; align-items: center; justify-content: center;
    user-select: none;
  }
  #btn-gas     { bottom: 50px;  right: 30px; width: 80px; height: 80px;
                 background: rgba(60,160,80,0.6); }
  #btn-brake   { bottom: 140px; right: 30px; width: 60px; height: 60px;
                 background: rgba(200,60,60,0.6); font-size: 18px; }
  #btn-h2h     { bottom: 30px;  left: 50%; transform: translateX(-50%);
                 width: 80px; height: 50px; border-radius: 25px;
                 background: rgba(255,80,80,0.7); font-size: 12px; }
  /* 桌面端隐藏触屏控件 */
  @media (hover: hover) and (pointer: fine) {
    #touch-controls { display: none !important; }
  }
  /* 触屏设备显示 */
  @media (hover: none) and (pointer: coarse) {
    #touch-controls { display: block; }
    #hud-bottom { display: none; }
  }
</style>

<body>
  <!-- 主游戏画布 -->
  <canvas id="game"></canvas>

  <!-- 左上角 HUD -->

<script>
/* ============================================================
 * 赛车淘汰之王 · The Eliminator 2D
 * 单文件 HTML5 Canvas 游戏
 * ============================================================ */

// ===== 全局画布与上下文 =====
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const miniCanvas = document.getElementById('minimap');
const miniCtx = miniCanvas.getContext('2d');

// ===== 世界常量 =====
const WORLD = { w: 8000, h: 8000 };   // 地图尺寸 8000x8000（大世界，车辆不挤）
const CAM_ZOOM = 0.55;                  // 摄像机缩放：视野更广，世界感更强
const TILE = 80;                       // 网格单元尺寸

/* ============================================================
 * 公路系统（参考地平线淘汰之王：主干道+乡村路网）
 * ============================================================ */
// 道路定义：每条道路是一条线段，包含端点与宽度
// 主干道是横纵两条穿越地图的高速；乡村路是网格状次干道
const ROADS = (() => {
  const list = [];
  // === 主干道（高速公路）：横纵两条穿越整张地图 ===
  // 横向主干（在地图中央 y=4000）
  list.push({ x1: 0, y1: WORLD.h/2, x2: WORLD.w, y2: WORLD.h/2, w: 100, type: 'highway' });
  // 纵向主干（在地图中央 x=4000）
  list.push({ x1: WORLD.w/2, y1: 0, x2: WORLD.w/2, y2: WORLD.h, w: 100, type: 'highway' });
  // 对角线高速（增加变化感）
  list.push({ x1: 0, y1: 0, x2: WORLD.w, y2: WORLD.h, w: 70, type: 'highway' });
  list.push({ x1: WORLD.w, y1: 0, x2: 0, y2: WORLD.h, w: 70, type: 'highway' });

  // === 乡村路（次干道）：网格状 ===
  // 横向乡村路：每 1000 像素一条
  for (let y = 1000; y < WORLD.h; y += 1000) {
    if (Math.abs(y - WORLD.h/2) < 50) continue;  // 跳过与主干重合
    list.push({ x1: 0, y1: y, x2: WORLD.w, y2: y, w: 50, type: 'local' });
  }
  // 纵向乡村路
  for (let x = 1000; x < WORLD.w; x += 1000) {
    if (Math.abs(x - WORLD.w/2) < 50) continue;
    list.push({ x1: x, y1: 0, x2: x, y2: WORLD.h, w: 50, type: 'local' });
  }
  return list;
})();

// 判断一个点是否在公路上（返回是否在主干/乡村路上）
function pointOnRoad(x, y) {
  for (const r of ROADS) {
    // 点到线段距离
    const dx = r.x2 - r.x1, dy = r.y2 - r.y1;
    const len2 = dx*dx + dy*dy;
    if (len2 === 0) continue;
    let t = ((x - r.x1)*dx + (y - r.y1)*dy) / len2;
    t = Math.max(0, Math.min(1, t));
    const px = r.x1 + t*dx, py = r.y1 + t*dy;
    const d = Math.hypot(x - px, y - py);
    if (d < r.w/2) return r.type;  // 'highway' or 'local'
  }
  return null;
}

// 在公路沿线随机生成一点（车包/检查点/出生位置用）
function randomPointOnRoad(preferType) {
  // 在随机道路上，随机 t 值取一点，再偏移 ±宽度
  for (let tries = 0; tries < 30; tries++) {
    const r = ROADS[Math.floor(Math.random() * ROADS.length)];
    if (preferType && r.type !== preferType) continue;
    const t = 0.1 + Math.random() * 0.8;  // 避开两端边界
    const x = r.x1 + (r.x2 - r.x1) * t + (Math.random()-0.5) * r.w * 0.6;
    const y = r.y1 + (r.y2 - r.y1) * t + (Math.random()-0.5) * r.w * 0.6;
    if (x > 200 && x < WORLD.w-200 && y > 200 && y < WORLD.h-200) return { x, y };
  }
  // fallback：地图随机点
  return { x: 200 + Math.random()*(WORLD.w-400), y: 200 + Math.random()*(WORLD.h-400) };
}

// ===== 车辆等级表（1~10 级）=====
// [最大速度, 加速度, 转向速度]
const CAR_LEVELS = {
  1:  { maxSpeed: 80,  accel: 40,  turn: 1.5, name: '老甲壳虫' },
  2:  { maxSpeed: 100, accel: 50,  turn: 1.6, name: '家用轿车' },
  3:  { maxSpeed: 120, accel: 60,  turn: 1.7, name: '城市小跑' },
  4:  { maxSpeed: 140, accel: 70,  turn: 1.8, name: '运动轿车' },
  5:  { maxSpeed: 160, accel: 80,  turn: 1.9, name: '小钢炮' },
  6:  { maxSpeed: 180, accel: 90,  turn: 2.0, name: '肌肉车' },
  7:  { maxSpeed: 200, accel: 100, turn: 2.1, name: '入门超跑' },
  8:  { maxSpeed: 220, accel: 110, turn: 2.2, name: '中级超跑' },
  9:  { maxSpeed: 240, accel: 120, turn: 2.3, name: '顶级超跑' },
  10: { maxSpeed: 260, accel: 130, turn: 2.4, name: '顶级神车' },
};

// ===== AI 颜色池 =====
const AI_COLORS = ['#ff5252', '#ff9800', '#ab47bc', '#66bb6a', '#ec407a',
                   '#7e57c2', '#26a69a', '#ffa726', '#ef5350', '#5c6bc0'];

// ===== 游戏状态 =====
let game; // 全局游戏状态对象

// ===== 输入状态 =====
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  // 空格触发 1v1
  if (e.key === ' ') { tryTriggerHeadToHead(); }
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// ===== 触屏控制状态（手机端用）=====
const touch = {
  enabled: false,         // 是否启用触屏控制
  joystick: { x: 0, y: 0, active: false },  // 摇杆向量（-1~1）
  gas: false,             // 加速
  brake: false,           // 刹车
};

// 检测触屏设备
if (window.matchMedia('(hover: none) and (pointer: coarse)').matches) {
  touch.enabled = true;
  document.getElementById('touch-controls').style.display = 'block';
}

// 虚拟摇杆逻辑
(function setupJoystick() {
  const base = document.getElementById('joystick-base');
  const stick = document.getElementById('joystick-stick');
  if (!base || !stick) return;
  let baseRect = null;
  let touchId = null;

  function start(e) {
    e.preventDefault();
    baseRect = base.getBoundingClientRect();
    touchId = e.changedTouches[0].identifier;
    move(e);
    touch.joystick.active = true;
  }
  function move(e) {
    if (touchId === null) return;
    let t = null;
    for (const ct of e.changedTouches) {
      if (ct.identifier === touchId) { t = ct; break; }
    }
    if (!t) return;
    const cx = baseRect.left + baseRect.width / 2;
    const cy = baseRect.top + baseRect.height / 2;
    let dx = t.clientX - cx;
    let dy = t.clientY - cy;
    const maxR = baseRect.width / 2;
    const dist = Math.hypot(dx, dy);
    if (dist > maxR) { dx = dx / dist * maxR; dy = dy / dist * maxR; }
    stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    touch.joystick.x = dx / maxR;
    touch.joystick.y = dy / maxR;
  }
  function end(e) {
    let ended = false;
    for (const ct of e.changedTouches) {
      if (ct.identifier === touchId) { ended = true; break; }
    }
    if (!ended) return;
    touchId = null;
    touch.joystick.active = false;
    touch.joystick.x = 0; touch.joystick.y = 0;
    stick.style.transform = 'translate(-50%, -50%)';
  }
  base.addEventListener('touchstart', start, { passive: false });
  base.addEventListener('touchmove', move,  { passive: false });
  base.addEventListener('touchend',  end,  { passive: false });
  base.addEventListener('touchcancel', end, { passive: false });
})();

// 按钮：加速 / 刹车 / 1v1
function bindTouchBtn(id, onDown, onUp) {
  const el = document.getElementById(id);
  if (!el) return;
  const dn = e => { e.preventDefault(); onDown(); };
  const up = e => { e.preventDefault(); onUp(); };
  el.addEventListener('touchstart', dn, { passive: false });
  el.addEventListener('touchend',   up, { passive: false });
  el.addEventListener('touchcancel', up, { passive: false });
}
bindTouchBtn('btn-gas',   () => touch.gas = true,   () => touch.gas = false);
bindTouchBtn('btn-brake', () => touch.brake = true, () => touch.brake = false);
bindTouchBtn('btn-h2h',   () => tryTriggerHeadToHead(), () => {});

// ===== 画布自适应（桌面端 16:9；移动端铺满全屏）=====
function resizeCanvas() {
  let w = window.innerWidth, h = window.innerHeight;
  if (!touch.enabled) {
    // 桌面端保持 16:9
    const aspect = 16 / 9;
    if (w / h > aspect) w = h * aspect;
    else h = w / aspect;
  }
  canvas.width = w;
  canvas.height = h;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

/* ============================================================
 * 车辆类（玩家与 AI 共用基础）
 * ============================================================ */
class Car {
  constructor(x, y, color, level, isPlayer = false) {
    this.x = x; this.y = y;
    this.angle = 0;          // 朝向弧度
    this.speed = 0;          // 当前标量速度
    this.color = color;
    this.level = level;
    this.isPlayer = isPlayer;
    this.hp = 100;
    this.alive = true;
    this.stealth = false;    // 隐身状态
    this.stillTimer = 0;     // 静止计时器（用于隐身）
    this.w = 26; this.h = 40; // 车身尺寸
    // AI 行为参数
    this.aiTarget = null;    // AI 当前目标点
    this.aiTimer = 0;        // AI 决策计时
    this.aiSeekPlayer = false;
    this.dropCooldown = 3;   // 拾取车包冷却（开局3秒内不拾取，避免瞬间换车）
  }

  // 获取当前等级配置
  get stats() { return CAR_LEVELS[this.level]; }

  // 当前速度（px/s），带方向：正前进 / 负倒车
  update(dt, input) {
    if (!this.alive) return;
    const st = this.stats;

    // ===== 加速 / 刹车 / 倒车 =====
    if (input.forward) {
      this.speed += st.accel * dt;
    } else if (input.back) {
      this.speed -= st.accel * dt;
    } else {
      // 摩擦减速
      const fr = 60 * dt;
      if (this.speed > 0) this.speed = Math.max(0, this.speed - fr);
      else if (this.speed < 0) this.speed = Math.min(0, this.speed + fr);
    }
    // 限速
    const maxF = st.maxSpeed, maxB = st.maxSpeed * 0.4;
    if (this.speed > maxF) this.speed = maxF;
    if (this.speed < -maxB) this.speed = -maxB;
    // 拾取车包冷却递减
    if (this.dropCooldown > 0) this.dropCooldown -= dt;

    // ===== 转向（受速度影响）=====
    let turn = 0;
    if (input.left) turn -= 1;
    if (input.right) turn += 1;
    if (turn !== 0 && Math.abs(this.speed) > 1) {
      // 速度越快转向越迟钝
      const speedFactor = 1 - Math.min(0.6, Math.abs(this.speed) / st.maxSpeed * 0.6);
      this.angle += turn * st.turn * speedFactor * dt;
    }

    // ===== 位置更新 =====
    const vx = Math.cos(this.angle) * this.speed;
    const vy = Math.sin(this.angle) * this.speed;
    this.x += vx * dt;
    this.y += vy * dt;

    // ===== 边界墙碰撞反弹 =====
    const margin = 20;
    if (this.x < margin) { this.x = margin; this.speed *= -0.4; }
    if (this.x > WORLD.w - margin) { this.x = WORLD.w - margin; this.speed *= -0.4; }
    if (this.y < margin) { this.y = margin; this.speed *= -0.4; }
    if (this.y > WORLD.h - margin) { this.y = WORLD.h - margin; this.speed *= -0.4; }

    // ===== 隐身检测：完全停住2秒 =====
    if (Math.abs(this.speed) < 2 && !input.forward && !input.back) {
      this.stillTimer += dt;
      if (this.stillTimer >= 2) this.stealth = true;
    } else {
      this.stillTimer = 0;
      this.stealth = false;
    }
  }

  // 绘制车辆（世界坐标已应用摄像机变换）
  draw(ctx) {
    if (!this.alive) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);

    // 等级越高，车身越亮
    const bright = 0.4 + this.level * 0.06;
    // 隐身玩家变暗
    const alpha = this.stealth ? 0.35 : 1;

    // 车头微光（等级>=6 才显示）
    if (this.level >= 6) {
      ctx.fillStyle = `rgba(255,255,200,${0.3 * alpha})`;
      ctx.beginPath();
      ctx.arc(this.h / 2, 0, 10, 0, Math.PI * 2);
      ctx.fill();
    }

    // 车身矩形
    ctx.globalAlpha = alpha;
    ctx.fillStyle = this.color;
    ctx.fillRect(-this.h / 2, -this.w / 2, this.h, this.w);
    // 车身高亮描边
    ctx.strokeStyle = `rgba(255,255,255,${0.4 + bright * 0.3})`;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(-this.h / 2, -this.w / 2, this.h, this.w);

    // 前轮（两个小圆）
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(this.h / 2 - 4, -this.w / 2 + 3, 3, 0, Math.PI * 2);
    ctx.arc(this.h / 2 - 4, this.w / 2 - 3, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();

    // 玩家头顶三角标记
    if (this.isPlayer) {
      ctx.fillStyle = '#6cf';
      ctx.beginPath();
      ctx.moveTo(this.x, this.y - 32);
      ctx.lineTo(this.x - 5, this.y - 42);
      ctx.lineTo(this.x + 5, this.y - 42);
      ctx.closePath();
      ctx.fill();
    }

    // 车辆头顶等级标签（所有车都显示）
    ctx.save();
    // 等级背景颜色：1-3 灰，4-6 黄，7-9 橙，10 金
    let badgeColor;
    if (this.level >= 10) badgeColor = '#ffd700';
    else if (this.level >= 7) badgeColor = '#ff8c00';
    else if (this.level >= 4) badgeColor = '#ffd33d';
    else badgeColor = '#999';

    const badgeY = this.isPlayer ? this.y - 56 : this.y - 30;
    // 圆形徽章
    ctx.fillStyle = badgeColor;
    ctx.beginPath();
    ctx.arc(this.x, badgeY, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // 等级数字
    ctx.fillStyle = '#000';
    ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(this.level), this.x, badgeY);
    ctx.restore();
  }
}

/* ============================================================
 * 车包（Car Drop）类
 * ============================================================ */
class CarDrop {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.level = Math.floor(Math.random() * 10) + 1; // 1~10
    this.taken = false;
    this.particles = []; // 烟雾粒子
    this.t = 0;
  }
  update(dt) {
    this.t += dt;
    // 生成上升粒子
    if (Math.random() < 0.5) {
      this.particles.push({
        x: this.x + (Math.random() - 0.5) * 20,
        y: this.y,
        vy: -30 - Math.random() * 40,
        life: 1.5,
        r: 6 + Math.random() * 6,
      });
    }
    // 更新粒子
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) this.particles.splice(i, 1);
    }
  }
  draw(ctx) {
    if (this.taken) return;
    // 地面发光圆圈
    ctx.fillStyle = 'rgba(170,80,255,0.25)';
    ctx.beginPath();
    ctx.arc(this.x, this.y, 30, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(200,140,255,0.6)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 紫色烟雾柱（多个半透明圆叠加）
    for (let i = 0; i < 5; i++) {
      const off = (this.t * 40 + i * 14) % 70;
      const a = 0.3 * (1 - off / 70);
      ctx.fillStyle = `rgba(180,90,255,${a})`;
      ctx.beginPath();
      ctx.arc(this.x, this.y - off, 14 - off * 0.1, 0, Math.PI * 2);
      ctx.fill();
    }
    // 上升粒子
    for (const p of this.particles) {
      const a = Math.max(0, p.life / 1.5) * 0.5;
      ctx.fillStyle = `rgba(200,120,255,${a})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

/* ============================================================
 * 游戏初始化
 * ============================================================ */
function initGame() {
  // 创建玩家（Level 2，蓝色），出生在地图中央
  const player = new Car(WORLD.w / 2, WORLD.h / 2, '#3399ff', 2, true);

  // 创建 15 个 AI，等级 1~2 级随机（开局公平，谁也不会一上来就开高级车）
  // 出生位置沿公路随机分布（参考地平线淘汰之王：所有车从路上出发）
  const ais = [];
  for (let i = 0; i < 15; i++) {
    const lvl = Math.floor(Math.random() * 2) + 1;  // 1 或 2
    const p = randomPointOnRoad();
    const ai = new Car(p.x, p.y, AI_COLORS[i % AI_COLORS.length], lvl, false);
    ai.angle = Math.random() * Math.PI * 2;
    ais.push(ai);
  }

  // 安全区：圆心随机，初始半径 2500（地图 8000，半径占 ~1/3，给压力感）
  const zone = {
    cx: WORLD.w / 2 + (Math.random() - 0.5) * 800,
    cy: WORLD.h / 2 + (Math.random() - 0.5) * 800,
    radius: 2500,
    shrinkTimer: 0,         // 缩圈计时
    shrinkInterval: 20,    // 每 20 秒缩一次
    shrinkAmount: 180,      // 每次缩 180
    minRadius: 350,
  };

  // 车包列表：初始生成 12 个，全部沿公路分布（地平线淘汰之王风格）
  const drops = [];
  for (let i = 0; i < 12; i++) {
    const p = randomPointOnRoad();
    drops.push(new CarDrop(p.x, p.y));
  }

  game = {
    player, ais, zone, drops,
    allCars: () => [player, ...ais].filter(c => c.alive),
    // 1v1 状态
    h2h: null,            // {target, countdown, checkpoint, started, finished}
    h2hTimer: 0,
    // 决赛圈
    finalPhase: false,
    finalPoint: { x: WORLD.w / 2, y: WORLD.h / 2 },
    // 游戏状态
    state: 'playing',     // playing / h2h / choice / final / over / win
    over: false,
    // 摄像机
    cam: { x: player.x, y: player.y },
    // 车包刷新计时
    dropTimer: 0,
    // 倒计时显示
    countdownText: '',
    countdownTimer: 0,
  };
}

/* ============================================================
 * 尝试触发 1v1 挑战
 * ============================================================ */
function tryTriggerHeadToHead() {
  if (!game || game.state !== 'playing' || game.finalPhase) return;
  if (!game.player.alive) return;
  // 寻找最近的存活 AI（距离 < 200，提示用）
  let nearest = null, nd = Infinity;
  for (const ai of game.ais) {
    if (!ai.alive) continue;
    const d = Math.hypot(ai.x - game.player.x, ai.y - game.player.y);
    if (d < nd) { nd = d; nearest = ai; }
  }
  // 空格触发：距离 < 250
  if (nearest && nd < 250) {
    startHeadToHead(nearest);
  }
}

/* ============================================================
 * 开始 1v1
 * ============================================================ */
function startHeadToHead(target) {
  // 检查点必须生成在安全区内（避免出现在毒圈外扣血）
  // 在安全区圆心附近，半径*0.75 的范围内随机一点
  const z = game.zone;
  const r = z.radius * 0.75;
  const ang = Math.random() * Math.PI * 2;
  const dist = Math.random() * r;
  const cp = {
    x: Math.max(120, Math.min(WORLD.w - 120, z.cx + Math.cos(ang) * dist)),
    y: Math.max(120, Math.min(WORLD.h - 120, z.cy + Math.sin(ang) * dist)),
  };
  game.h2h = {
    target,
    checkpoint: cp,
    phase: 'countdown',  // countdown -> racing -> done
    timer: 0,
    winner: null,
  };
  game.state = 'h2h';
  game.h2hTimer = 0;
  // 倒计时 3,2,1,GO
  game.countdownText = '3';
  game.countdownTimer = 0;
  document.getElementById('h2h-banner').style.display = 'block';
}

/* ============================================================
 * 结束 1v1（实现见文件末尾，以保存对手引用供选择面板使用）
 * ============================================================ */

/* ============================================================
 * 显示结束画面
 * ============================================================ */
function showEndScreen(win, desc) {
  game.state = win ? 'win' : 'over';
  game.over = true;
  const screen = document.getElementById('end-screen');
  screen.className = win ? 'win' : 'lose';
  document.getElementById('end-title').textContent = win ? 'WINNER!' : 'GAME OVER';
  document.getElementById('end-desc').textContent = desc;
  screen.style.display = 'block';
}

/* ============================================================
 * 主更新逻辑
 * ============================================================ */
function update(dt) {
  if (game.over) return;

  // ===== 处理 1v1 倒计时与比赛 =====
  if (game.state === 'h2h' && game.h2h) {
    const h = game.h2h;
    h.timer += dt;

    if (h.phase === 'countdown') {
      game.countdownTimer += dt;
      const sec = game.countdownTimer;
      if (sec < 1) game.countdownText = '3';
      else if (sec < 2) game.countdownText = '2';
      else if (sec < 3) game.countdownText = '1';
      else if (sec < 3.6) game.countdownText = 'GO!';
      else {
        h.phase = 'racing';
        game.countdownText = '';
      }
    } else if (h.phase === 'racing') {
      // 判断谁先到达检查点
      const cpD_p = Math.hypot(h.checkpoint.x - game.player.x, h.checkpoint.y - game.player.y);
      const cpD_t = Math.hypot(h.checkpoint.x - h.target.x, h.checkpoint.y - h.target.y);
      if (cpD_p < 40) { endHeadToHead(true); return; }
      if (cpD_t < 40) { endHeadToHead(false); return; }
    }
  }

  // ===== 玩家输入（融合键盘 + 触屏）=====
  // 键盘
  let forward = keys['w'] || keys['arrowup'];
  let back    = keys['s'] || keys['arrowdown'];
  let left    = keys['a'] || keys['arrowleft'];
  let right   = keys['d'] || keys['arrowright'];
  // 触屏摇杆（y 向上为负 → forward，左/右推力直接驱动转向）
  if (touch.enabled && touch.joystick.active) {
    if (touch.joystick.y < -0.25) forward = true;
    if (touch.joystick.y >  0.25) back    = true;
    if (touch.joystick.x < -0.25) left    = true;
    if (touch.joystick.x >  0.25) right   = true;
  }
  // 触屏按钮
  if (touch.enabled) {
    if (touch.gas)   forward = true;
    if (touch.brake) back    = true;
  }
  const input = { forward, back, left, right };
  game.player.update(dt, input);

  // ===== 靠近 AI 自动触发 1v1（距离 < 80）=====
  if (game.state === 'playing' && !game.finalPhase && game.player.alive) {
    for (const ai of game.ais) {
      if (!ai.alive) continue;
      const d = Math.hypot(ai.x - game.player.x, ai.y - game.player.y);
      if (d < 80) {
        startHeadToHead(ai);
        break;
      }
    }
  }

  // ===== AI 更新 =====
  for (const ai of game.ais) {
    if (!ai.alive) continue;
    updateAI(ai, dt);
    ai.update(dt, ai._input || { forward: false, back: false, left: false, right: false });
  }

  // ===== 安全区缩小 =====
  game.zone.shrinkTimer += dt;
  if (game.zone.shrinkTimer >= game.zone.shrinkInterval) {
    game.zone.shrinkTimer = 0;
    game.zone.radius = Math.max(game.zone.minRadius, game.zone.radius - game.zone.shrinkAmount);
  }
  // 圆心缓慢向地图中心移动
  const tx = WORLD.w / 2, ty = WORLD.h / 2;
  game.zone.cx += (tx - game.zone.cx) * 0.05 * dt;
  game.zone.cy += (ty - game.zone.cy) * 0.05 * dt;

  // ===== 圈外扣血 =====
  const allCars = game.allCars();
  for (const c of allCars) {
    const d = Math.hypot(c.x - game.zone.cx, c.y - game.zone.cy);
    if (d > game.zone.radius) {
      c.hp -= 10 * dt;
      if (c.hp <= 0) {
        c.hp = 0;
        c.alive = false;
        if (c.isPlayer) showEndScreen(false, '你被缩圈淘汰了！');
      }
    }
  }

  // ===== 车包更新与拾取 =====
  game.dropTimer += dt;
  if (game.dropTimer > 8 && game.drops.filter(d => !d.taken).length < 8) {
    game.dropTimer = 0;
    const p = randomPointOnRoad();
    game.drops.push(new CarDrop(p.x, p.y));
  }
  for (const drop of game.drops) {
    if (drop.taken) continue;
    drop.update(dt);
    // 检测拾取
    for (const c of allCars) {
      if (!c.alive) continue;
      // 拾取冷却中：跳过（避免开局瞬间换车）
      if (c.dropCooldown > 0) continue;
      const d = Math.hypot(c.x - drop.x, c.y - drop.y);
      if (d < 30) {
        drop.taken = true;
        // 立即换一辆随机等级的新车（1~10）
        const newLevel = Math.floor(Math.random() * 10) + 1;
        c.level = newLevel;
        // 拾取后再进入冷却，避免连续拾取
        c.dropCooldown = 3;
        break;
      }
    }
  }
  // 清理已拾取的车包
  game.drops = game.drops.filter(d => !d.taken || d.particles.length > 0);

  // ===== 决赛圈触发（存活 ≤ 5）=====
  const aliveCount = allCars.length;
  if (!game.finalPhase && aliveCount <= 5) {
    game.finalPhase = true;
    game.state = 'final';
    const fb = document.getElementById('final-banner');
    fb.style.display = 'block';
    setTimeout(() => { fb.style.display = 'none'; }, 2500);
  }

  // ===== 决赛圈：检测是否到达终点 =====
  if (game.finalPhase) {
    const fp = game.finalPoint;
    for (const c of allCars) {
      const d = Math.hypot(c.x - fp.x, c.y - fp.y);
      if (d < 40) {
        if (c.isPlayer) {
          showEndScreen(true, '你是淘汰之王！');
        } else {
          // AI 先到终点，玩家失败
          showEndScreen(false, 'AI 抢先到达终点');
        }
        return;
      }
    }
  }

  // ===== 摄像机跟随玩家 =====
  game.cam.x += (game.player.x - game.cam.x) * 0.1;
  game.cam.y += (game.player.y - game.cam.y) * 0.1;
}

/* ============================================================
 * AI 行为更新
 * - 随机游走，偶尔向玩家移动，避开边界墙
 * - 主动拾取附近车包
 * - 玩家隐身时不主动靠近
 * ============================================================ */
function updateAI(ai, dt) {
  ai.aiTimer -= dt;
  // 决赛圈：所有 AI 冲向终点
  if (game.finalPhase) {
    steerTowards(ai, game.finalPoint.x, game.finalPoint.y, dt);
    ai._input = { forward: true, back: false, left: ai._turn < 0, right: ai._turn > 0 };
    return;
  }
  // 1v1 中：AI 冲向检查点
  if (game.state === 'h2h' && game.h2h && game.h2h.target === ai && game.h2h.phase === 'racing') {
    steerTowards(ai, game.h2h.checkpoint.x, game.h2h.checkpoint.y, dt);
    ai._input = { forward: true, back: false, left: ai._turn < 0, right: ai._turn > 0 };
    return;
  }

  // 决策：每 2~4 秒切换目标
  if (ai.aiTimer <= 0 || !ai.aiTarget) {
    ai.aiTimer = 2 + Math.random() * 3;

    // 优先：附近车包
    let nearestDrop = null, nd = 400;
    for (const d of game.drops) {
      if (d.taken) continue;
      const dist = Math.hypot(d.x - ai.x, d.y - ai.y);
      if (dist < nd) { nd = dist; nearestDrop = d; }
    }

    // 概率：靠近玩家（仅当玩家未隐身）
    if (!game.player.stealth && game.player.alive && Math.random() < 0.35) {
      ai.aiSeekPlayer = true;
      ai.aiTarget = { x: game.player.x, y: game.player.y };
    } else if (nearestDrop) {
      ai.aiSeekPlayer = false;
      ai.aiTarget = { x: nearestDrop.x, y: nearestDrop.y };
    } else {
      ai.aiSeekPlayer = false;
      // 随机游走点
      ai.aiTarget = {
        x: 200 + Math.random() * (WORLD.w - 400),
        y: 200 + Math.random() * (WORLD.h - 400),
      };
    }
  }

  // 边界避让：靠近边界则强制调头
  const edge = 150;
  if (ai.x < edge || ai.x > WORLD.w - edge || ai.y < edge || ai.y > WORLD.h - edge) {
    ai.aiTarget = { x: WORLD.w / 2, y: WORLD.h / 2 };
  }

  // 圈外时主动往圈内走
  const dz = Math.hypot(ai.x - game.zone.cx, ai.y - game.zone.cy);
  if (dz > game.zone.radius - 50) {
    ai.aiTarget = { x: game.zone.cx, y: game.zone.cy };
  }

  steerTowards(ai, ai.aiTarget.x, ai.aiTarget.y, dt);
  ai._input = { forward: true, back: false, left: ai._turn < 0, right: ai._turn > 0 };
}

// 让 AI 朝目标点转向，设置 ai._turn (-1/0/1)
function steerTowards(ai, tx, ty, dt) {
  const desired = Math.atan2(ty - ai.y, tx - ai.x);
  let diff = desired - ai.angle;
  while (diff > Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  // 转向
  const turnRate = ai.stats.turn * 1.2;
  if (Math.abs(diff) > 0.1) {
    ai.angle += Math.sign(diff) * Math.min(Math.abs(diff), turnRate * dt);
    ai._turn = Math.sign(diff);
  } else {
    ai._turn = 0;
  }
}

/* ============================================================
 * 渲染主函数
 * ============================================================ */
function render() {
  // 清屏
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 摄像机变换：以画布中心为原点，再应用 zoom 缩放
  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.scale(CAM_ZOOM, CAM_ZOOM);
  ctx.translate(-game.cam.x, -game.cam.y);

  // ===== 绘制世界背景（网格）=====
  drawWorld();

  // ===== 绘制安全区与圈外危险区 =====
  drawZone();

  // ===== 绘制决赛终点 =====
  if (game.finalPhase) drawFinalPoint();

  // ===== 绘制车包 =====
  for (const d of game.drops) d.draw(ctx);

  // ===== 绘制 1v1 检查点 =====
  if (game.h2h && game.h2h.checkpoint && game.h2h.phase !== 'done') {
    drawCheckpoint(game.h2h.checkpoint);
  }

  // ===== 绘制车辆 =====
  for (const c of game.allCars()) c.draw(ctx);

  ctx.restore();

  // ===== 绘制 HUD =====
  drawHUD();
  drawMinimap();

  // ===== 倒计时文字 =====
  const cd = document.getElementById('countdown');
  if (game.countdownText) {
    cd.textContent = game.countdownText;
    cd.style.display = 'block';
  } else {
    cd.style.display = 'none';
  }

  // ===== 隐身指示 =====
  document.getElementById('stealth-indicator').style.display =
    (game.player.stealth && game.player.alive) ? 'block' : 'none';
}

/* ============================================================
 * 绘制世界网格背景
 * ============================================================ */
function drawWorld() {
  // 视口范围（含 zoom 反算：扩大视野裁剪范围以避免缩放后边缘裁剪）
  const halfW = canvas.width / 2 / CAM_ZOOM + TILE;
  const halfH = canvas.height / 2 / CAM_ZOOM + TILE;
  const x0 = Math.max(0, game.cam.x - halfW);
  const y0 = Math.max(0, game.cam.y - halfH);
  const x1 = Math.min(WORLD.w, game.cam.x + halfW);
  const y1 = Math.min(WORLD.h, game.cam.y + halfH);

  // 草地底色（暗绿）
  ctx.fillStyle = '#1d2a1d';
  ctx.fillRect(0, 0, WORLD.w, WORLD.h);

  // 草地纹理：稀疏点状（模拟草地颗粒）
  ctx.fillStyle = 'rgba(60,80,60,0.4)';
  for (let gx = Math.floor(x0/100)*100; gx <= x1; gx += 100) {
    for (let gy = Math.floor(y0/100)*100; gy <= y1; gy += 100) {
      // 用确定性伪随机（坐标 hash）保证不闪烁
      const h = ((gx * 73856093) ^ (gy * 19349663)) >>> 0;
      const px = gx + (h % 60) - 30;
      const py = gy + ((h >> 8) % 60) - 30;
      ctx.fillRect(px, py, 2, 2);
    }
  }

  // ===== 绘制公路系统 =====
  drawRoads(x0, y0, x1, y1);

  // 边界墙
  ctx.strokeStyle = '#ff5252';
  ctx.lineWidth = 6;
  ctx.strokeRect(3, 3, WORLD.w - 6, WORLD.h - 6);
}

/* ============================================================
 * 绘制所有道路：路基+路面+车道线
 * ============================================================ */
function drawRoads(x0, y0, x1, y1) {
  for (const r of ROADS) {
    const isHighway = r.type === 'highway';
    // 路基（比路面宽一点，作为路肩）
    ctx.strokeStyle = isHighway ? '#3a3a3a' : '#2e2e2e';
    ctx.lineWidth = r.w + 8;
    ctx.lineCap = 'butt';
    ctx.beginPath();
    ctx.moveTo(r.x1, r.y1); ctx.lineTo(r.x2, r.y2);
    ctx.stroke();

    // 路面（沥青黑灰）
    ctx.strokeStyle = isHighway ? '#4a4a4a' : '#3a3a3a';
    ctx.lineWidth = r.w;
    ctx.beginPath();
    ctx.moveTo(r.x1, r.y1); ctx.lineTo(r.x2, r.y2);
    ctx.stroke();

    // 中央双黄线（主干道）/ 单黄线（乡村路）
    ctx.strokeStyle = '#ffcc00';
    ctx.lineWidth = isHighway ? 3 : 2;
    ctx.setLineDash(isHighway ? [20, 12] : [10, 8]);
    ctx.beginPath();
    ctx.moveTo(r.x1, r.y1); ctx.lineTo(r.x2, r.y2);
    ctx.stroke();
    ctx.setLineDash([]);

    // 路边白线
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 1.5;
    const dx = r.x2 - r.x1, dy = r.y2 - r.y1;
    const len = Math.hypot(dx, dy);
    if (len > 0) {
      const nx = -dy / len, ny = dx / len;  // 法向量
      const off = r.w / 2 - 2;
      ctx.beginPath();
      ctx.moveTo(r.x1 + nx*off, r.y1 + ny*off);
      ctx.lineTo(r.x2 + nx*off, r.y2 + ny*off);
      ctx.moveTo(r.x1 - nx*off, r.y1 - ny*off);
      ctx.lineTo(r.x2 - nx*off, r.y2 - ny*off);
      ctx.stroke();
    }
  }
}

/* ============================================================
 * 绘制安全区与圈外
 * ============================================================ */
function drawZone() {
  const z = game.zone;
  // 圈外深红半透明覆盖（用 evenodd 规则挖洞）
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, WORLD.w, WORLD.h);
  ctx.arc(z.cx, z.cy, z.radius, 0, Math.PI * 2, true);
  ctx.fillStyle = 'rgba(120,0,0,0.35)';
  ctx.fill('evenodd');
  ctx.restore();

  // 安全区内浅灰
  ctx.save();
  ctx.beginPath();
  ctx.arc(z.cx, z.cy, z.radius, 0, Math.PI * 2);
  ctx.clip();
  ctx.fillStyle = 'rgba(180,180,200,0.05)';
  ctx.fillRect(0, 0, WORLD.w, WORLD.h);
  ctx.restore();

  // 安全区蓝圈边框
  ctx.strokeStyle = 'rgba(80,180,255,0.8)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(z.cx, z.cy, z.radius, 0, Math.PI * 2);
  ctx.stroke();
}

/* ============================================================
 * 绘制决赛终点（金色光圈）
 * ============================================================ */
function drawFinalPoint() {
  const p = game.finalPoint;
  const t = performance.now() / 1000;
  // 外圈脉冲
  for (let i = 0; i < 3; i++) {
    const r = 50 + (t * 30 + i * 20) % 60;
    ctx.strokeStyle = `rgba(255,210,60,${0.5 - i * 0.15})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.stroke();
  }
  // 中心光柱
  const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 60);
  grad.addColorStop(0, 'rgba(255,230,100,0.8)');
  grad.addColorStop(1, 'rgba(255,210,60,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(p.x, p.y, 60, 0, Math.PI * 2);
  ctx.fill();
}

/* ============================================================
 * 绘制 1v1 检查点（金色圆环 + 光柱）
 * ============================================================ */
function drawCheckpoint(cp) {
  const t = performance.now() / 1000;
  // 光柱
  const grad = ctx.createRadialGradient(cp.x, cp.y, 0, cp.x, cp.y, 40);
  grad.addColorStop(0, 'rgba(255,220,80,0.7)');
  grad.addColorStop(1, 'rgba(255,210,60,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cp.x, cp.y, 40, 0, Math.PI * 2);
  ctx.fill();
  // 圆环
  ctx.strokeStyle = '#ffd33d';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cp.x, cp.y, 25 + Math.sin(t * 4) * 3, 0, Math.PI * 2);
  ctx.stroke();
  // 中心点
  ctx.fillStyle = '#ffd33d';
  ctx.beginPath();
  ctx.arc(cp.x, cp.y, 5, 0, Math.PI * 2);
  ctx.fill();
}

/* ============================================================
 * 绘制 HUD（左上角文字更新）
 * ============================================================ */
function drawHUD() {
  // 血量条
  document.getElementById('hp-fill').style.width = Math.max(0, game.player.hp) + '%';
  // 车辆等级
  const lvl = game.player.level;
  document.getElementById('car-level-name').textContent = `Lv.${lvl} ${CAR_LEVELS[lvl].name}`;
  // 速度
  document.getElementById('speed-val').textContent = Math.round(Math.abs(game.player.speed));
  // 存活人数
  document.getElementById('alive-count').textContent = game.allCars().length;
}

/* ============================================================
 * 绘制小地图
 * ============================================================ */
function drawMinimap() {
  const W = miniCanvas.width, H = miniCanvas.height;
  const sx = W / WORLD.w, sy = H / WORLD.h;
  miniCtx.fillStyle = '#111';
  miniCtx.fillRect(0, 0, W, H);

  // 安全区
  const z = game.zone;
  miniCtx.strokeStyle = 'rgba(80,180,255,0.8)';
  miniCtx.lineWidth = 1;
  miniCtx.beginPath();
  miniCtx.arc(z.cx * sx, z.cy * sy, z.radius * sx, 0, Math.PI * 2);
  miniCtx.stroke();

  // 车包
  for (const d of game.drops) {
    if (d.taken) continue;
    miniCtx.fillStyle = '#bb5cff';
    miniCtx.fillRect(d.x * sx - 1.5, d.y * sy - 1.5, 3, 3);
  }

  // 检查点
  if (game.h2h && game.h2h.checkpoint) {
    const cp = game.h2h.checkpoint;
    miniCtx.fillStyle = '#ffd33d';
    miniCtx.beginPath();
    miniCtx.arc(cp.x * sx, cp.y * sy, 3, 0, Math.PI * 2);
    miniCtx.fill();
  }

  // 决赛终点
  if (game.finalPhase) {
    miniCtx.fillStyle = '#ffd33d';
    miniCtx.beginPath();
    miniCtx.arc(game.finalPoint.x * sx, game.finalPoint.y * sy, 4, 0, Math.PI * 2);
    miniCtx.fill();
  }

  // AI
  for (const ai of game.ais) {
    if (!ai.alive) continue;
    miniCtx.fillStyle = ai.color;
    miniCtx.fillRect(ai.x * sx - 1, ai.y * sy - 1, 2, 2);
  }

  // 玩家
  if (game.player.alive) {
    miniCtx.fillStyle = game.player.stealth ? 'rgba(50,150,255,0.4)' : '#3399ff';
    miniCtx.beginPath();
    miniCtx.arc(game.player.x * sx, game.player.y * sy, 2.5, 0, Math.PI * 2);
    miniCtx.fill();
  }

  // 边框
  miniCtx.strokeStyle = '#444';
  miniCtx.lineWidth = 1;
  miniCtx.strokeRect(0.5, 0.5, W - 1, H - 1);
}

/* ============================================================
 * 主循环
 * ============================================================ */
let lastTime = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  if (game && !game.over) update(dt);
  if (game) render();
  requestAnimationFrame(loop);
}

/* ============================================================
 * 1v1 胜利选择按钮
 * ============================================================ */
document.getElementById('choice-steal').addEventListener('click', () => {
  // 夺取对方的车（如果对方等级更高）
  // 这里我们直接拿对方等级
  // 找到最后被击败的 AI（在 h2h._target 之前保存过）
  // 简化：从 h2h 中我们已经 endHeadToHead 清空了引用，所以需要另一种方式
  // 修复：在 endHeadToHead 之前保存对手等级
  const targetLevel = game._lastDefeatedLevel || 3;
  if (targetLevel > game.player.level) {
    game.player.level = targetLevel;
  } else {
    // 对方等级不高，给个提示后改用升级
    game.player.level = Math.min(10, game.player.level + 1);
  }
  closeChoicePanel();
  eliminateLastDefeated();
});
document.getElementById('choice-upgrade').addEventListener('click', () => {
  game.player.level = Math.min(10, game.player.level + 1);
  closeChoicePanel();
  eliminateLastDefeated();
});
function closeChoicePanel() {
  document.getElementById('choice-panel').style.display = 'none';
  game.state = 'playing';
}
function eliminateLastDefeated() {
  // 1v1 胜利后淘汰对手
  if (game._lastDefeated) {
    game._lastDefeated.alive = false;
    game._lastDefeated = null;
  }
}

/* ============================================================
 * 重新开始按钮
 * ============================================================ */
document.getElementById('restart-btn').addEventListener('click', () => {
  document.getElementById('end-screen').style.display = 'none';
  document.getElementById('choice-panel').style.display = 'none';
  document.getElementById('h2h-banner').style.display = 'none';
  document.getElementById('final-banner').style.display = 'none';
  initGame();
});

/* ============================================================
 * 结束 1v1：保存对手引用与等级，供选择面板使用
 * ============================================================ */
function endHeadToHead(playerWon) {
  const h = game.h2h;
  document.getElementById('h2h-banner').style.display = 'none';
  if (playerWon) {
    // 保存对手引用与等级
    game._lastDefeated = h.target;
    game._lastDefeatedLevel = h.target.level;
    game.state = 'choice';
    const desc = document.getElementById('choice-desc');
    desc.textContent = `击败了 Lv.${h.target.level} ${CAR_LEVELS[h.target.level].name}。选择奖励：`;
    document.getElementById('choice-panel').style.display = 'block';
  } else {
    game.player.alive = false;
    game.player.hp = 0;
    showEndScreen(false, '你在 1v1 中落败，被淘汰！');
  }
  game.h2h = null;
}

/* ============================================================
 * 启动游戏
 * ============================================================ */
initGame();
requestAnimationFrame(loop);
</script>
